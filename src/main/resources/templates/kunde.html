<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Annie+Use+Your+Telescope&display=swap" rel="stylesheet">
    <title>Olsker Cupcakes - Kundeprofil</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>

<body>
<header class="top-bar">
    <div class="info-text">
        LOGGET IND SOM ADMIN: <span th:text="${session.currentUser.firstName}">Admin</span>
    </div>
    <div class="user-menu">
        <a href="/admin/alle-kunder" class="btn-min-side">TILBAGE</a>
        <a href="/logout" class="btn-min-side">LOG UD</a>
    </div>
</header>

<section class="logo-container">
    <h1>KUNDEPROFIL</h1>
    <div class="hotpink-line-thick"></div>
</section>

<section class="selection-box customer-details centered-content">
    <h2 class="view-title">ADMINISTRER SALDO</h2>

    <div class="info-highlight-box">
        <p><strong>KUNDE:</strong> <span th:text="${selectedCustomer.firstName} + ' ' + ${selectedCustomer.lastName}">Navn</span></p>
        <p><strong>EMAIL:</strong> <span th:text="${selectedCustomer.email}">Email</span></p>
    </div>

    <p>Nuværende saldo: <strong><span th:text="${selectedCustomer.balance}">0</span> kr.</strong></p>

    <form action="/admin/update-balance" method="post" class="admin-balance-form">
        <input type="hidden" name="customerId" th:value="${selectedCustomer.userId}">

        <div class="balance-input-group">
            <input type="number" name="amount" placeholder="Beløb..." min="1" required>
            <button type="submit" class="btn-tilfoej">INDSÆT PENGE</button>
        </div>
    </form>
</section>

<main class="customer-content">

    <section th:if="${valgtVisning == 'kurv'}" class="selection-box customer-details wide-box">
        <h2 class="view-title">GEMT INDKØBSKURV</h2>
        <div class="hotpink-line-thick small-spacer-line"></div>

        <table class="data-table" th:if="${kurvListe != null && !kurvListe.isEmpty()}">
            <thead>
            <tr>
                <th>TOP</th>
                <th>BUND</th>
                <th>ANTAL</th>
                <th>PRIS</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="line : ${kurvListe}">
                <td th:text="${line.cupcake.top.name}"></td>
                <td th:text="${line.cupcake.bottom.name}"></td>
                <td th:text="${line.quantity}"></td>
                <td th:text="${line.getTotalPrice()} + ' kr.'"></td>
            </tr>
            </tbody>
        </table>
        <p class="centered-content" th:if="${kurvListe == null || kurvListe.isEmpty()}">Ingen gemt kurv fundet.</p>
    </section>

    <section th:if="${valgtVisning == 'historik'}" class="selection-box customer-details wide-box">
        <h2 class="view-title">ORDREHISTORIK</h2>
        <div class="hotpink-line-thick small-spacer-line"></div>

        <table class="data-table" th:if="${ordreHistorik != null && !ordreHistorik.isEmpty()}">
            <thead>
            <tr>
                <th>DATO</th>
                <th>ORDRE ID</th>
                <th>STATUS</th>
                <th>TOTAL</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ordre : ${ordreHistorik}">
                <td th:text="${ordre.timeStamp}"></td>
                <td th:text="${ordre.orderId}"></td>
                <td th:text="${ordre.status}"></td>
                <td th:text="${ordre.totalPrice} + ' kr.'"></td>
            </tr>
            </tbody>
        </table>
        <p class="centered-content" th:if="${ordreHistorik == null || ordreHistorik.isEmpty()}">Ingen ordrer fundet.</p>
    </section>

</main>

<footer class="bottom-decoration">
    <div class="hotpink-line-thick"></div>
</footer>
</body>
</html>
