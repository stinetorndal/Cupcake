<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Oscars Opslagstavle</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../public/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>

<body class="board-body">

<div class="logout-box" style="position: absolute; top: 20px; right: 20px; z-index: 100;">
    <form method="post" action="/logout">
        <button type="submit" style="background-color: #f44336; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">
            Log ud
        </button>
    </form>
</div>

<div class="top-section">
    <div class="container small-container">
        <h1>Oscars Opslagstavle</h1>

        <form method="post" action="/gem-post" class="login-form">
            <input type="text" name="titel" placeholder="Overskrift" maxlength="50" required>
            <textarea name="indhold" placeholder="Skriv din roman her..." maxlength="500" required></textarea>
            <button type="submit">Sæt på tavlen</button>
        </form>
    </div>
</div>

<div class="board-grid">
    <div th:each="post : ${allePosts}" class="post-it">
        <h3 th:text="${post.title}">Titel</h3>
        <p th:text="${post.content}">Indhold</p>

        <a th:href="@{/se-post/{id}(id=${post.postId})}" class="pin-link">Se detaljer</a>
    </div>
</div>

</body>
</html>
